steps:
# 1. Construire l'image Docker
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA', '.']

# 2. Envoyer l'image vers le registre (indispensable pour Cloud Run)
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA']

# 3. Déployer sur Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'stradisimo-app'
  - '--image'
  - 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA'
  - '--region'
  - 'europe-west1'
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated'

images:
- 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY