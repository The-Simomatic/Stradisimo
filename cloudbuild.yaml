steps:
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA', '.']

# Nouvelle étape : Déployer sur Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'stradisimo-app'
  - '--image'
  - 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA'
  - '--region'
  - 'europe-west1' # Ou votre région préférée
  - '--platform'
  - 'managed'
  - '--allow-unauthenticated' # Pour que le site soit public

images:
- 'gcr.io/$PROJECT_ID/stradisimo:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY